# AWS Amplify Hosting configuration for Kode
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || true
        - node -v
        - npm ci --prefer-offline --no-audit --fund=false
    build:
      commands:
        - echo "Building Kode"
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*

customHeaders:
  - pattern: "**/*"
    headers:
      - key: Cross-Origin-Opener-Policy
        value: same-origin
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
  - pattern: "/index.html"
    headers:
      - key: Cache-Control
        value: "public, max-age=0, must-revalidate"
